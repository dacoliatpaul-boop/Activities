<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokedex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">

  </head>
  <body>'
    <div>
      <div class="container">
        <div class="page-title">
          <div class="row">
            <div class="col">
              <h1>POKÉDEX</h1>
            </div>
          </div>
          
        </div>
        <div class="row" id="parent">
        </div>
      </div>
    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous">  
    </script>

    <script>
        var Pokemon = [
            {
                name: "Bulbasaur",
                dex_num: "National No: 001",
                type: ["Type: Grass", "Poison"],
                abilities: ["Abilities: Overgrow", "Chlorophyll"],
                image: "assets/images/bulbasaur.avif",
                description: "Pokedex entries: For some time after its birth, it grows by taking nourishment from the seed on its back. ",
            },
            {
                name: "Ivysaur",
                dex_num: "National No: 002",
                type: ["Type: Grass", "Poison"],
                abilities: ["Abilities: Overgrow", "Chlorophyll"],
                image: "assets/images/002.png",
                description: "Pokedex entries: The bulb on its back grows as it absorbs nutrients. The bulb gives off a pleasant aroma when it blooms.",
            },
            {
                name: "Venasaur",
                dex_num: "National No: 003",
                type: ["Type: Grass", "Poison"],
                abilities: ["Abilities: Overgrow", "Chlorophyll"],
                image: "assets/images/003.png",
                description: "Pokedex entries: By spreading the broad petals of its flower and catching the sun’s rays, it fills its body with power.",
            },
            {
                name: "Charmander",
                dex_num: "National No: 004",
                type: ["Type: Fire"],
                abilities: ["Abilities: Blaze", "Solar Power"],
                image: "assets/images/charmander.jpg",
                description: "Pokedex entries: The fire on the tip of its tail is a measure of its life. If the Pokémon is healthy, its tail burns intensely.",
            },
            {
                name: "Charmeleon",
                dex_num: "National No: 005",
                type: ["Type: Fire"],
                abilities: ["Abilities: Blaze", "Solar Power"],
                image: "assets/images/005.png",
                description: "Pokedex entries: It is very hotheaded by nature, so it constantly seeks opponents to battle against. Its aggression will not be quelled if it doesn’t win.",
            },
            {
                name: "Charizard",
                dex_num: "National No: 006",
                type: ["Type: Fire, Flying"],
                abilities: ["Abilities: Blaze", "Solar Power"],
                image: "assets/images/006.png",
                description: "Pokedex entries: It uses its wings to fly sky-high. The more experience it gains in battle, the greater the temperature at which its flames burn.",
            },
            {
                name: "Squirtle",
                dex_num: "National No: 007",
                type: ["Type: Water"],
                abilities: ["Abilities: Torrent", "Rain Dish"],
                image: "assets/images/squirtle.avif",
                description: "Pokedex entries: It hides in its shell to protect itself, then strikes back with spouts of water at every opportunity. ",
            },
            {
                name: "Wartortle",
                dex_num: "National No: 008",
                type: ["Type: Water"],
                abilities: ["Abilities: Torrent", "Rain Dish"],
                image: "assets/images/008.png",
                description: "Pokedex entries: It often hides in water to stalk unwary prey. While swimming quickly, it moves its ears to maintain balance. ",
            },
            {
                name: "Blastoise",
                dex_num: "National No: 009",
                type: ["Type: Water"],
                abilities: ["Abilities: Torrent", "Rain Dish"],
                image: "assets/images/009.png",
                description: "Pokedex entries: It has jet nozzles on its shell. This impressive Pokémon uses these jets to charge toward foes with all the force of a rocket. ",
            },
            {
                name: "Pikachu",
                dex_num: "National No: 025",
                type: ["Type: Electric"],
                abilities: ["Abilities: Static", "Lightning Rod"],
                image: "assets/images/pikachu.avif",
                description: "Pokedex entries: When several of these Pokémon gather, their electricity can build and cause lightning storms.  ",
            }
        ]

        var elParent = document.getElementById("parent");
        for (var i = 0; i < Pokemon.length; i++) {
            elParent.innerHTML +=
                `<div class="col">
                <div class="card h-100 p-3 my-3 shadow rounded-4">
                     <img src="${Pokemon[i].image}" alt="${Pokemon[i].name}"
                     style="height: 250px; object-fit: contain; ">
                  <div class="h4 text-center mt-5" id=>` + Pokemon[i].name +`</div>
                  <div class="p-3" id=>` + Pokemon[i].dex_num +`</div>
                  <div class="p-3" id=>` + Pokemon[i].type +`</div>
                  <div class="p-3" id=>` + Pokemon[i].abilities +`</div>
                  <div class="p-3" id=>` + Pokemon[i].description +`</div>
                  <div class="mt-3">
                  </div>
                </div>
              </div>`;
        }
    </script>
  </body>
</html>
