<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GZW Armory | Browse Weapons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .item-card { transition: transform .15s, box-shadow .15s; cursor: pointer; }
    .item-card:hover { transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem rgba(0,0,0,.15) !important; }
    .item-thumb { height: 150px; }
    .item-thumb img { max-height: 120px; max-width: 90%; object-fit: contain; }
  </style>
</head>

<body class="bg-body-tertiary">

  <!-- Top bar -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow">
    <div class="container d-flex flex-wrap gap-2 align-items-center">
      <span class="navbar-brand fw-bold text-uppercase m-0">🎖️ GZW Armory</span>
      <div class="flex-grow-1 mx-md-4" style="max-width: 520px;">
        <input type="search" id="searchInput" class="form-control rounded-pill" placeholder="Search weapons...">
      </div>
      <select id="caliberSelect" class="form-select form-select-sm w-auto rounded-pill">
        <option value="">All calibers</option>
      </select>
      <select id="sortSelect" class="form-select form-select-sm w-auto rounded-pill">
        <option value="name">Sort: Name</option>
        <option value="rate">Sort: Fire rate</option>
        <option value="weight">Sort: Weight</option>
      </select>
    </div>
  </nav>

  <!-- Hero + type filters -->
  <header class="bg-dark text-white pb-4">
    <div class="container pt-4">
      <h1 class="h2 fw-bold mb-1">Browse weapons</h1>
      <p class="text-white-50 mb-3">Live data from the Gray Zone Warfare API.</p>
      <div class="d-flex flex-wrap gap-2" id="filters"></div>
    </div>
  </header>

  <!-- Results -->
  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="text-muted" id="resultCount">Loading...</div>
      <button class="btn btn-sm btn-link text-decoration-none d-none" id="clearBtn">Clear filters</button>
    </div>
    <div class="alert alert-danger d-none" id="errorBox"></div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4" id="grid"></div>
    <div class="text-center py-5 d-none" id="empty">
      <div class="display-4">🔍</div>
      <p class="text-muted mt-2">No weapons match your search.</p>
    </div>
  </main>

  <!-- Detail modal -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content rounded-4 overflow-hidden">
        <div class="bg-dark d-flex align-items-center justify-content-center position-relative text-white" style="height: 180px; font-size: 4rem;" id="mImage"></div>
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="modal-body p-4">
          <h2 class="h4 mb-2" id="mName"></h2>
          <div class="d-flex flex-wrap gap-2 mb-3" id="mBadges"></div>
          <table class="table table-sm table-striped mb-0"><tbody id="mTable"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const ORIGIN = "https://gzw-data.dev";
    const API_URL = ORIGIN + "/api/v1/weapons";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (v) => parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, ""));
    const nice = (k) => k.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

    // The spec was not machine-readable from here, so field lookups tolerate a few common names.
    const pick = (r, ...keys) => {
      for (const k of keys) if (r[k] !== undefined && r[k] !== null && r[k] !== "") return r[k];
      return "";
    };
    const getType    = (r) => pick(r, "type", "category", "weapon_type", "class");
    const getCaliber = (r) => pick(r, "caliber");
    const getRate    = (r) => pick(r, "fire_rate", "firerate", "rate_of_fire");
    const getWeight  = (r) => pick(r, "weight");
    const getImage   = (r) => {
      const u = pick(r, "image", "image_url", "icon", "img");
      if (!u || typeof u !== "string") return "";
      return /^https?:/.test(u) ? u : ORIGIN + (u.startsWith("/") ? "" : "/") + u;
    };

    let all = [];
    let view = [];
    let type = "";
    let timer;
    const modal = new bootstrap.Modal($("detailModal"));

    const sorters = {
      name: (a, b) => String(a.name).localeCompare(String(b.name)),
      rate: (a, b) => (num(getRate(b)) || -1) - (num(getRate(a)) || -1),
      weight: (a, b) => (num(getWeight(b)) || -1) - (num(getWeight(a)) || -1),
    };

    async function load() {
      try {
        // Follow pagination until every record has been collected.
        let page = 1, total = Infinity;
        while (all.length < total && page <= 10) {
          const res = await fetch(`${API_URL}?per_page=100&page=${page}`);
          if (!res.ok) throw new Error(`API returned ${res.status}`);
          const payload = await res.json();
          const rows = Array.isArray(payload) ? payload : payload.data || [];
          all.push(...rows);
          total = Array.isArray(payload) ? rows.length : (payload.total ?? rows.length);
          if (rows.length === 0) break;
          page++;
        }
        buildFilters();
        render();
      } catch (err) {
        $("resultCount").textContent = "";
        $("errorBox").textContent = "Could not load weapons: " + err.message;
        $("errorBox").classList.remove("d-none");
      }
    }

    function buildFilters() {
      const types = [...new Set(all.map(getType).filter(Boolean))].sort();
      renderTypePills(types);
      const cals = [...new Set(all.map(getCaliber).filter(Boolean))].sort();
      $("caliberSelect").innerHTML = '<option value="">All calibers</option>' + cals.map((c) => `<option>${esc(c)}</option>`).join("");
    }

    function renderTypePills(types) {
      $("filters").innerHTML = ["", ...types].map((t) =>
        `<button class="btn btn-sm rounded-pill ${t === type ? "btn-light" : "btn-outline-light"}" data-type="${esc(t)}">${t ? esc(t) : "All"}</button>`
      ).join("");
    }

    function render() {
      const q = $("searchInput").value.trim().toLowerCase();
      const cal = $("caliberSelect").value;
      view = all.filter((r) =>
        (!type || getType(r) === type) &&
        (!cal || getCaliber(r) === cal) &&
        (!q || [r.name, getType(r), getCaliber(r), r.manufacturer].join(" ").toLowerCase().includes(q))
      ).sort(sorters[$("sortSelect").value]);

      $("grid").innerHTML = view.map((r) => {
        const img = getImage(r);
        return `
          <div class="col">
            <div class="card item-card h-100 border-0 shadow-sm rounded-4 overflow-hidden" data-id="${esc(r.id)}">
              <div class="bg-secondary-subtle d-flex align-items-center justify-content-center item-thumb fs-1">
                ${img ? `<img src="${esc(img)}" alt="${esc(r.name)}" loading="lazy">` : "🔫"}
              </div>
              <div class="card-body">
                <div class="small text-uppercase text-muted fw-semibold">${esc(getType(r))}</div>
                <h3 class="h6 card-title mb-1">${esc(r.name)}</h3>
                <div class="small text-muted">${esc(getCaliber(r))}</div>
              </div>
              <div class="card-footer bg-white border-0 pt-0 d-flex justify-content-between small">
                <span>⚡ ${esc(getRate(r) || "N/A")}</span>
                <span>⚖️ ${esc(getWeight(r) || "N/A")}</span>
              </div>
            </div>
          </div>`;
      }).join("");

      $("resultCount").textContent = `${view.length} weapon${view.length === 1 ? "" : "s"}` + (type ? ` in ${type}` : "");
      $("empty").classList.toggle("d-none", view.length > 0);
      $("clearBtn").classList.toggle("d-none", !type && !q && !cal);
    }

    function showDetail(id) {
      const r = all.find((x) => String(x.id) === id);
      if (!r) return;
      const img = getImage(r);
      $("mImage").innerHTML = img ? `<img src="${esc(img)}" alt="" style="max-height:150px;max-width:90%;object-fit:contain">` : "🔫";
      $("mName").textContent = r.name;
      $("mBadges").innerHTML =
        (getType(r) ? `<span class="badge rounded-pill text-bg-dark">${esc(getType(r))}</span>` : "") +
        (getCaliber(r) ? `<span class="badge rounded-pill text-bg-secondary">${esc(getCaliber(r))}</span>` : "");
      // Show every field the API returned, whatever the schema is.
      $("mTable").innerHTML = Object.entries(r)
        .filter(([k, v]) => !["id", "name"].includes(k) && v !== "" && v !== null && typeof v !== "object")
        .map(([k, v]) => `<tr><th class="fw-normal text-muted">${esc(nice(k))}</th><td class="text-end">${esc(v)}</td></tr>`)
        .join("");
      modal.show();
    }

    // Events
    $("filters").addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-type]");
      if (!btn) return;
      type = btn.dataset.type;
      buildFilters();
      render();
    });
    $("grid").addEventListener("click", (ev) => {
      const card = ev.target.closest("[data-id]");
      if (card) showDetail(card.dataset.id);
    });
    $("searchInput").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 200); });
    $("sortSelect").addEventListener("change", render);
    $("caliberSelect").addEventListener("change", render);
    $("clearBtn").addEventListener("click", () => {
      type = ""; $("searchInput").value = ""; $("caliberSelect").value = "";
      buildFilters(); render();
    });

    load();
  </script>
</body>

</html>
